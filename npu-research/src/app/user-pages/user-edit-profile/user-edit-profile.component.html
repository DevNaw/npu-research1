<div class="min-h-screen bg-linear-to-br from-slate-50 via-gray-50 to-slate-100 px-5 py-6 md:px-10 md:py-8 text-[#394250] font-medium">

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

    <!-- Header -->
    <div class="flex items-center gap-4 bg-linear-to-r from-[#f2cb05] to-[#f2e7ac] px-6 py-5">
      <div class="w-11 h-11 rounded-xl bg-white/30 flex items-center justify-center text-[#394250] text-xl shrink-0">
        <i class="bi bi-pencil-square"></i>
      </div>
      <div>
        <h1 class="text-xl font-semibold text-[#394250]">แก้ไขข้อมูลนักวิจัย</h1>
        <p class="text-sm text-[#394250]/70 font-light">ข้อมูลประวัติทั่วไป</p>
      </div>
    </div>

    <!-- Form Body -->
    <div class="px-6 py-8 md:px-10 space-y-6">

      <!-- ===== Section: เลขบัตรประชาชน ===== -->
      <div class="flex items-center gap-3 text-xs font-semibold uppercase tracking-widest text-gray-400 before:flex-1 before:h-px before:bg-gray-100 after:flex-1 after:h-px after:bg-gray-100">
        เลขบัตรประจำตัวประชาชน
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1.5">เลขบัตรประจำตัวประชาชน</label>
        <input [(ngModel)]="data.id_card_number"
          class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 focus:border-[#f2cb05] transition-all"
          placeholder="ระบุเลขบัตรประจำตัวประชาชน" />
      </div>

      <!-- ===== Section: ชื่อ-นามสกุล (ไทย) ===== -->
      <div class="flex items-center gap-3 text-xs font-semibold uppercase tracking-widest text-gray-400 before:flex-1 before:h-px before:bg-gray-100 after:flex-1 after:h-px after:bg-gray-100">
        ชื่อ-นามสกุล (ภาษาไทย)
      </div>

      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-3">
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">คำนำหน้าชื่อ</label>
          <input [(ngModel)]="data.prefix_th"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 focus:border-[#f2cb05] transition-all"
            placeholder="คำนำหน้าชื่อ" />
        </div>
        <div class="md:col-span-4">
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">ชื่อ</label>
          <input [(ngModel)]="data.first_name"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 focus:border-[#f2cb05] transition-all"
            placeholder="ชื่อ" />
        </div>
        <div class="md:col-span-5">
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">นามสกุล</label>
          <input [(ngModel)]="data.last_name"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 focus:border-[#f2cb05] transition-all"
            placeholder="นามสกุล" />
        </div>
      </div>

      <!-- ===== Section: ชื่อ-นามสกุล (อังกฤษ) ===== -->
      <div class="flex items-center gap-3 text-xs font-semibold uppercase tracking-widest text-gray-400 before:flex-1 before:h-px before:bg-gray-100 after:flex-1 after:h-px after:bg-gray-100">
        ชื่อ-นามสกุล (English)
      </div>

      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-3">
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">คำนำหน้าชื่อ (EN)</label>
          <input [(ngModel)]="data.prefix_en"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 focus:border-[#f2cb05] transition-all"
            placeholder="Prefix" />
        </div>
        <div class="md:col-span-4">
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">ชื่อภาษาอังกฤษ</label>
          <input [(ngModel)]="data.first_name_en"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 focus:border-[#f2cb05] transition-all"
            placeholder="First name" />
        </div>
        <div class="md:col-span-5">
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">นามสกุลภาษาอังกฤษ</label>
          <input [(ngModel)]="data.last_name_en"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 focus:border-[#f2cb05] transition-all"
            placeholder="Last name" />
        </div>
      </div>

      <!-- ===== Section: วันเกิด / อายุ ===== -->
      <div class="flex items-center gap-3 text-xs font-semibold uppercase tracking-widest text-gray-400 before:flex-1 before:h-px before:bg-gray-100 after:flex-1 after:h-px after:bg-gray-100">
        วันเกิดและอายุ
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">วัน/เดือน/ปีเกิด</label>
          <input [(ngModel)]="data.date_of_birth" type="date" (change)="calculateAge()"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 focus:border-[#f2cb05] transition-all" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">อายุ</label>
          <div class="flex items-center gap-3">
            <input [(ngModel)]="data.age" type="number"
              class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 focus:border-[#f2cb05] transition-all text-center" />
            <span class="text-sm text-gray-500 shrink-0">ปี</span>
          </div>
        </div>
      </div>

      <!-- ===== Section: ข้อมูลส่วนตัว ===== -->
      <div class="flex items-center gap-3 text-xs font-semibold uppercase tracking-widest text-gray-400 before:flex-1 before:h-px before:bg-gray-100 after:flex-1 after:h-px after:bg-gray-100">
        ข้อมูลส่วนตัว
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <!-- เชื้อชาติ -->
        <div class="relative">
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">เชื้อชาติ</label>
          <button (click)="toggle('ethnicity', $event)"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 flex justify-between items-center bg-white text-sm font-light hover:border-[#f2cb05] focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 transition-all">
            <span>{{ data.ethnicity || "เลือก" }}</span>
            <i class="bi bi-chevron-down text-gray-400 text-xs ml-2"></i>
          </button>
          <div *ngIf="isOpen('ethnicity')" (click)="$event.stopPropagation()"
            class="absolute z-50 w-full bg-white border border-gray-200 rounded-xl mt-1 shadow-lg text-sm font-light overflow-hidden">
            <input [(ngModel)]="searchEthnicity" placeholder="ค้นหา..."
              class="w-full px-4 py-2.5 border-b border-gray-100 outline-none text-sm" />
            <ul class="max-h-48 overflow-y-auto">
              <li *ngFor="let e of filteredEthnicity()" (click)="selectEthnicitys(e)"
                class="px-4 py-2.5 hover:bg-amber-50 cursor-pointer transition-colors">{{ e }}</li>
              <li *ngIf="filteredEthnicity().length === 0" class="px-4 py-2.5 text-gray-400 text-center">ไม่พบข้อมูล</li>
            </ul>
          </div>
        </div>

        <!-- สัญชาติ -->
        <div class="relative">
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">สัญชาติ</label>
          <button type="button" (click)="toggle('nationality', $event)"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 flex justify-between items-center bg-white text-sm font-light hover:border-[#f2cb05] focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 transition-all">
            <span>{{ data.nationality || "เลือก" }}</span>
            <i class="bi bi-chevron-down text-gray-400 text-xs ml-2"></i>
          </button>
          <div *ngIf="isOpen('nationality')" (click)="$event.stopPropagation()"
            class="absolute z-50 w-full bg-white border border-gray-200 rounded-xl mt-1 shadow-lg text-sm font-light overflow-hidden">
            <input [(ngModel)]="searchNationality" placeholder="ค้นหา..." (click)="$event.stopPropagation()"
              class="w-full px-4 py-2.5 border-b border-gray-100 outline-none text-sm" />
            <ul class="max-h-48 overflow-y-auto">
              <li *ngFor="let n of filteredNationality()" (click)="selectNationalitys(n)"
                class="px-4 py-2.5 hover:bg-amber-50 cursor-pointer transition-colors">{{ n }}</li>
              <li *ngIf="filteredNationality().length === 0" class="px-4 py-2.5 text-gray-400 text-center">ไม่พบข้อมูล</li>
            </ul>
          </div>
        </div>

        <!-- ศาสนา -->
        <div class="relative">
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">ศาสนา</label>
          <button (click)="toggle('religion', $event)"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 flex justify-between items-center bg-white text-sm font-light hover:border-[#f2cb05] focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 transition-all">
            <span>{{ data.religion || "เลือก" }}</span>
            <i class="bi bi-chevron-down text-gray-400 text-xs ml-2"></i>
          </button>
          <div *ngIf="isOpen('religion')" (click)="$event.stopPropagation()"
            class="absolute z-50 w-full bg-white border border-gray-200 rounded-xl mt-1 shadow-lg text-sm font-light overflow-hidden">
            <input [(ngModel)]="searchReligion" placeholder="ค้นหา..."
              class="w-full px-4 py-2.5 border-b border-gray-100 outline-none text-sm" />
            <ul class="max-h-48 overflow-y-auto">
              <li *ngFor="let r of filteredReligion()" (click)="selectReligion(r)"
                class="px-4 py-2.5 hover:bg-amber-50 cursor-pointer transition-colors">{{ r }}</li>
              <li *ngIf="filteredReligion().length === 0" class="px-4 py-2.5 text-gray-400 text-center">ไม่พบข้อมูล</li>
            </ul>
          </div>
        </div>
      </div>

      <!-- ===== Section: ติดต่อ ===== -->
      <div class="flex items-center gap-3 text-xs font-semibold uppercase tracking-widest text-gray-400 before:flex-1 before:h-px before:bg-gray-100 after:flex-1 after:h-px after:bg-gray-100">
        ข้อมูลติดต่อ
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">เบอร์โทรศัพท์มือถือ</label>
          <input [(ngModel)]="data.phone"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 focus:border-[#f2cb05] transition-all"
            placeholder="ระบุเบอร์โทรศัพท์" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-600 mb-1.5">อีเมล</label>
          <input [(ngModel)]="data.email"
            class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/30 focus:border-[#f2cb05] transition-all"
            placeholder="ระบุอีเมล" />
        </div>
      </div>

      <!-- ===== Submit ===== -->
      <div class="flex justify-center pt-4 border-t border-gray-100">
        <button (click)="save()"
          class="inline-flex items-center gap-3 px-10 py-3.5 bg-linear-to-r from-[#f2cb05] to-[#e0b800] hover:from-[#e0b800] hover:to-[#f2cb05] text-[#394250] font-semibold text-base rounded-2xl shadow-lg shadow-yellow-200 hover:shadow-xl hover:-translate-y-0.5 transition-all cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#f2cb05]/50">
          <i class="bi bi-floppy2 text-lg"></i>
          บันทึกข้อมูล
        </button>
      </div>

    </div>
  </div>
</div>
