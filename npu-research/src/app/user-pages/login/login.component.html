<div
  class="relative min-h-screen flex items-center justify-center bg-linear-to-br from-gray-50 via-gray-100 to-slate-200 px-4 py-8 font-medium overflow-hidden"
>
  <!-- ===== Decorative Background ===== -->
  <div
    class="absolute top-0 left-0 w-96 h-96 rounded-full bg-[#F2CB05]/10 blur-3xl -translate-x-1/2 -translate-y-1/2 pointer-events-none"
  ></div>
  <div
    class="absolute bottom-0 right-0 w-96 h-96 rounded-full bg-[#F2CB05]/10 blur-3xl translate-x-1/3 translate-y-1/3 pointer-events-none"
  ></div>
  <div
    class="absolute top-1/2 left-1/2 w-150 h-150 rounded-full bg-white/30 blur-3xl -translate-x-1/2 -translate-y-1/2 pointer-events-none"
  ></div>

  <!-- ===== Main Card ===== -->
  <div class="relative w-full max-w-md">
    <!-- ===== Top Logo Section ===== -->
    <div class="flex items-center justify-center gap-4 mb-6">
      <!-- Logo with glow -->
      <div class="relative shrink-0">
        <div
          class="absolute inset-0 bg-[#F2CB05]/30 blur-2xl rounded-full"
        ></div>
        <div
          class="relative w-20 h-20 bg-white rounded-2xl shadow-lg flex items-center justify-center border border-gray-100"
        >
          <img
            src="/assets/logoNPU.png"
            alt="NPU"
            class="w-14 h-14 object-contain"
          />
        </div>
      </div>

      <!-- Text -->
      <div class="text-left leading-tight">
        <h2 class="text-xl sm:text-2xl font-semibold text-[#394250]">
          ระบบฐานข้อมูลวิจัย
        </h2>
        <p class="text-xs sm:text-sm text-gray-500 mt-0.5">
          Research Database System
        </p>
        <h2 class="text-base sm:text-lg text-[#F2CB05] font-semibold mt-1">
          มหาวิทยาลัยนครพนม
        </h2>
      </div>
    </div>

    <!-- ===== Form Card ===== -->
    <div
      class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 sm:p-8"
    >
      <!-- Card Header -->
      <div class="mb-6">
        <h1 class="text-xl font-semibold text-[#394250]">ยินดีต้อนรับกลับ</h1>
        <p class="text-sm text-gray-500 mt-1">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
      </div>

      <form class="space-y-4" (ngSubmit)="goToDashboard()">
        <!-- Username -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1.5 ml-1">
            อีเมล / ชื่อผู้ใช้
          </label>
          <div class="relative">
            <div
              class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
            >
              <i class="bi bi-person-circle text-xl"></i>
            </div>
            <input
              [(ngModel)]="username"
              name="username"
              type="text"
              required
              class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#F2CB05]/30 focus:border-[#F2CB05] focus:bg-white transition-all text-sm font-light placeholder:text-gray-400"
              placeholder="example@npu.ac.th"
            />
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1.5 ml-1">
            รหัสผ่าน
          </label>
          <div class="relative">
            <div
              class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
            >
              <i class="bi bi-lock-fill text-xl"></i>
            </div>
            <input
              [(ngModel)]="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              required
              class="w-full pl-11 pr-11 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#F2CB05]/30 focus:border-[#F2CB05] focus:bg-white transition-all text-sm font-light placeholder:text-gray-400"
              placeholder="••••••••"
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#F2CB05] cursor-pointer transition-colors p-1"
            >
              <i
                class="bi text-lg"
                [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"
              ></i>
            </button>
          </div>
        </div>

        <!-- Remember + Forgot -->
        <div class="flex items-center justify-between text-sm pt-1">
          <label class="flex items-center gap-2 cursor-pointer group">
            <input
              type="checkbox"
              class="w-4 h-4 rounded border-gray-300 text-[#F2CB05] focus:ring-[#F2CB05]/30 cursor-pointer accent-[#F2CB05]"
            />
            <span
              class="text-gray-600 group-hover:text-[#394250] transition-colors"
              >จดจำฉันไว้</span
            >
          </label>
          <a class="text-[#F2CB05] hover:underline cursor-pointer font-medium">
            ลืมรหัสผ่าน?
          </a>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="group w-full py-3 mt-2 rounded-xl bg-linear-to-r from-[#F2CB05] to-[#e0b800] hover:from-[#e0b800] hover:to-[#F2CB05] text-white font-semibold shadow-lg shadow-yellow-200/50 hover:shadow-xl hover:shadow-yellow-200/70 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer"
        >
          <span>เข้าสู่ระบบ</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center text-xs">
          <span class="px-3 bg-white text-gray-400">หรือ</span>
        </div>
      </div>

      <!-- Register -->
      <div class="text-center">
        <p class="text-sm text-gray-600">
          ยังไม่มีบัญชีผู้ใช้?
          <a
            routerLink="/register"
            class="ml-1 text-[#F2CB05] hover:underline font-semibold"
          >
            ลงทะเบียน
          </a>
        </p>
      </div>
    </div>

    <!-- ===== Footer Text ===== -->
    <p class="text-center text-xs text-gray-400 mt-6">
      © 2026 NPU Research Database System
    </p>
  </div>
</div>
