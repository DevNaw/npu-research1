<div class="relative min-h-screen flex lg:items-center justify-center bg-linear-to-br from-gray-50 via-gray-100 to-slate-200 px-3 md:px-4 py-8 text-[#394250] font-medium overflow-hidden">

  <!-- ===== Decorative Background ===== -->
  <div class="absolute top-0 right-0 w-96 h-96 rounded-full bg-[#F2CB05]/10 blur-3xl translate-x-1/3 -translate-y-1/3 pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 w-96 h-96 rounded-full bg-[#F2CB05]/10 blur-3xl -translate-x-1/3 translate-y-1/3 pointer-events-none"></div>

  <div class="relative w-full max-w-xl">
    <!-- ===== Header ===== -->
    <div class="mb-5">
      <button
        (click)="goToLogin()"
        class="inline-flex items-center gap-2 group cursor-pointer text-gray-600 hover:text-[#394250] transition-colors mb-3"
      >
        <i class="bi bi-arrow-left-circle-fill text-lg group-hover:text-[#F2CB05] group-hover:-translate-x-1 transition-all"></i>
        <span class="text-sm">กลับไปเข้าสู่ระบบ</span>
      </button>

      <div class="text-center">
        <h2 class="text-2xl sm:text-3xl font-semibold text-[#394250]">ลงทะเบียนผู้ใช้งาน</h2>
        <p class="text-sm text-gray-500 mt-1">กรอกข้อมูลด้านล่างเพื่อสร้างบัญชีใหม่</p>
      </div>
    </div>

    <!-- ===== Card ===== -->
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
      <!-- Card Header -->
      <div class="relative bg-linear-to-r from-[#F2CB05] to-[#e0b800] px-6 py-4 flex items-center gap-3 overflow-hidden">
        <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full bg-white/10 blur-xl"></div>
        <div class="relative w-11 h-11 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center border border-white/30">
          <i class="bi bi-person-plus-fill text-xl text-white"></i>
        </div>
        <div class="relative">
          <h3 class="text-lg font-semibold text-white">กรอกข้อมูลผู้ใช้งาน</h3>
          <p class="text-xs text-white/80">โปรดกรอกข้อมูลให้ครบทุกช่องที่จำเป็น</p>
        </div>
      </div>

      <!-- Form -->
      <form class="p-6 space-y-4" (ngSubmit)="submit()">

        <!-- ชื่อ - นามสกุล -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1.5 ml-1">
              ชื่อ <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <i class="bi bi-person-circle absolute left-3 top-1/2 -translate-y-1/2 text-lg text-gray-400 pointer-events-none"></i>
              <input
                name="first_name"
                [(ngModel)]="registerData.first_name"
                type="text"
                class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#F2CB05]/30 focus:border-[#F2CB05] focus:bg-white transition-all placeholder:text-gray-400"
                placeholder="กรอกชื่อ"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1.5 ml-1">
              นามสกุล <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <i class="bi bi-person-circle absolute left-3 top-1/2 -translate-y-1/2 text-lg text-gray-400 pointer-events-none"></i>
              <input
                name="last_name"
                [(ngModel)]="registerData.last_name"
                type="text"
                class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#F2CB05]/30 focus:border-[#F2CB05] focus:bg-white transition-all placeholder:text-gray-400"
                placeholder="กรอกนามสกุล"
              />
            </div>
          </div>
        </div>

        <!-- อีเมล -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1.5 ml-1">
            อีเมล <span class="text-red-500">*</span>
            <span class="ml-1 inline-block px-2 py-0.5 bg-red-50 text-red-500 text-[10px] rounded-full font-normal">
              เฉพาะ &#64;npu.ac.th
            </span>
          </label>
          <div class="relative">
            <i class="bi bi-envelope-fill absolute left-3 top-1/2 -translate-y-1/2 text-lg text-gray-400 pointer-events-none"></i>
            <input
              name="email"
              [(ngModel)]="registerData.email"
              type="email"
              class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#F2CB05]/30 focus:border-[#F2CB05] focus:bg-white transition-all placeholder:text-gray-400"
              placeholder="example@npu.ac.th"
            />
          </div>
        </div>

        <!-- หน่วยงาน -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1.5 ml-1">
            หน่วยงาน <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <button
              type="button"
              (click)="toggle('organization', $event)"
              class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl flex justify-between items-center text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#F2CB05]/30 focus:border-[#F2CB05] hover:bg-white transition-all cursor-pointer"
              [ngClass]="{'bg-white border-[#F2CB05] ring-2 ring-[#F2CB05]/30': openDropdown === 'organization'}"
            >
              <i class="bi bi-building absolute left-3 top-1/2 -translate-y-1/2 text-lg text-gray-400 pointer-events-none"></i>
              <span class="truncate" [ngClass]="selectedOrganization?.faculty ? 'text-[#394250]' : 'text-gray-400'">
                {{ selectedOrganization?.faculty || "เลือกหน่วยงาน" }}
              </span>
              <i class="bi bi-chevron-down text-gray-400 transition-transform" [ngClass]="{'rotate-180': openDropdown === 'organization'}"></i>
            </button>

            <div
              *ngIf="openDropdown === 'organization'"
              (click)="$event.stopPropagation()"
              class="absolute z-50 w-full bg-white border border-gray-200 rounded-xl mt-2 shadow-lg text-sm font-light overflow-hidden"
            >
              <ul class="max-h-56 overflow-y-auto">
                <li
                  *ngFor="let o of organizations"
                  (click)="selectOrganization(o)"
                  class="px-4 py-2.5 hover:bg-[#F2E7AC]/40 cursor-pointer transition-colors border-b border-gray-50 last:border-b-0 flex items-center gap-2"
                >
                  <i class="bi bi-building text-[#F2CB05]"></i>
                  {{ o.faculty }}
                </li>
              </ul>
            </div>
          </div>
        </div>

        <!-- รหัสผ่าน + ยืนยันรหัสผ่าน -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- รหัสผ่าน -->
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1.5 ml-1">
              รหัสผ่าน <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <i class="bi bi-lock-fill absolute left-3 top-1/2 -translate-y-1/2 text-lg text-gray-400 pointer-events-none"></i>
              <input
                name="Password"
                [(ngModel)]="registerData.password"
                [type]="showPassword ? 'text' : 'password'"
                class="w-full pl-10 pr-11 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#F2CB05]/30 focus:border-[#F2CB05] focus:bg-white transition-all placeholder:text-gray-400"
                placeholder="••••••••"
              />
              <button
                type="button"
                (click)="showPassword = !showPassword"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#F2CB05] cursor-pointer transition-colors p-1"
              >
                <i class="bi text-lg" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
              </button>
            </div>
          </div>

          <!-- ยืนยันรหัสผ่าน -->
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1.5 ml-1">
              ยืนยันรหัสผ่าน <span class="text-red-500">*</span>
            </label>
            <div class="relative">
              <i class="bi bi-shield-lock-fill absolute left-3 top-1/2 -translate-y-1/2 text-lg text-gray-400 pointer-events-none"></i>
              <input
                name="password_confirmation"
                [(ngModel)]="registerData.password_confirmation"
                [type]="showConfirmPassword ? 'text' : 'password'"
                class="w-full pl-10 pr-11 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#F2CB05]/30 focus:border-[#F2CB05] focus:bg-white transition-all placeholder:text-gray-400"
                placeholder="••••••••"
              />
              <button
                type="button"
                (click)="showConfirmPassword = !showConfirmPassword"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#F2CB05] cursor-pointer transition-colors p-1"
              >
                <i class="bi text-lg" [ngClass]="showConfirmPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- สาขาที่เชี่ยวชาญ -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1.5 ml-1">
            สาขาที่เชี่ยวชาญ <span class="text-red-500">*</span>
            <span class="text-gray-400 font-normal ml-1">(พิมพ์แล้วกด Enter)</span>
          </label>
          <div class="flex flex-wrap items-center gap-2 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 min-h-12 focus-within:ring-2 focus-within:ring-[#F2CB05]/30 focus-within:border-[#F2CB05] focus-within:bg-white transition-all">
            <span
              *ngFor="let m of registerData.expertises; let i = index"
              class="group inline-flex items-center gap-1.5 pl-3 pr-1 py-1 text-[#394250] text-sm font-medium rounded-full bg-linear-to-r from-[#F2CB05] to-[#F2E7AC] shadow-sm"
            >
              {{ m }}
              <button
                type="button"
                (click)="removeMajor(i)"
                class="w-5 h-5 rounded-full bg-white/30 hover:bg-red-500 hover:text-white flex items-center justify-center cursor-pointer transition-colors text-xs"
              >
                <i class="bi bi-x"></i>
              </button>
            </span>
            <input
              name="majorInput"
              [(ngModel)]="majorInput"
              (keydown)="addMajor($event)"
              [attr.size]="majorInput.length || 1"
              class="flex-1 outline-none bg-transparent font-light text-sm min-w-32 placeholder:text-gray-400"
              placeholder="พิมพ์สาขาแล้วกด Enter..."
            />
          </div>
        </div>

        <!-- ความสนใจพิเศษ -->
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1.5 ml-1">
            ความสนใจพิเศษ
            <span class="text-gray-400 font-normal ml-1">(ไม่บังคับ)</span>
          </label>
          <textarea
            name="interests"
            rows="3"
            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm font-light focus:outline-none focus:ring-2 focus:ring-[#F2CB05]/30 focus:border-[#F2CB05] focus:bg-white transition-all resize-none placeholder:text-gray-400"
            placeholder="ระบุความสนใจพิเศษเพิ่มเติม (ถ้ามี)"
          ></textarea>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="group w-full py-3 mt-2 rounded-xl bg-linear-to-r from-[#F2CB05] to-[#e0b800] hover:from-[#e0b800] hover:to-[#F2CB05] text-white font-semibold shadow-lg shadow-yellow-200/50 hover:shadow-xl hover:shadow-yellow-200/70 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer"
        >
          <i class="bi bi-person-check-fill text-lg"></i>
          <span>ลงทะเบียน</span>
          <i class="bi bi-arrow-right text-base group-hover:translate-x-0.5 transition-transform"></i>
        </button>

        <!-- Login Link -->
        <div class="relative my-2">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200"></div>
          </div>
          <div class="relative flex justify-center text-xs">
            <span class="px-3 bg-white text-gray-400">หรือ</span>
          </div>
        </div>

        <p class="text-center text-sm text-gray-600">
          มีบัญชีอยู่แล้ว?
          <a
            (click)="goToLogin()"
            class="ml-1 text-[#F2CB05] hover:underline font-semibold cursor-pointer"
          >
            เข้าสู่ระบบ
          </a>
        </p>
      </form>
    </div>

    <!-- ===== Footer ===== -->
    <p class="text-center text-xs text-gray-400 mt-6">
      © 2026 NPU Research Database System
    </p>
  </div>
</div>
